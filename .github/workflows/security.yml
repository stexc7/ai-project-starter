name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Lunes a las 6:00 UTC — detecta CVEs publicados durante la semana.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  secrets:
    name: Escaneo de secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Historial completo: un secreto borrado sigue estando en los commits anteriores.
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    # Descomenta y ajusta los lenguajes de tu proyecto.
    if: false
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript']
        # Opciones: c-cpp, csharp, go, java-kotlin, javascript-typescript,
        #           python, ruby, swift
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v3
        with:
          language: ${{ matrix.language }}

      - uses: github/codeql-action/autobuild@v3

      - uses: github/codeql-action/analyze@v3

  dependencies:
    name: Auditoría de dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Requiere el Dependency graph activado:
      #   Settings → Security → Code security → Dependency graph
      # Mientras esté desactivado, la acción falla con
      # "Dependency review is not supported on this repository".
      # Va como no bloqueante para que un repo recién creado desde la plantilla
      # no tenga el CI en rojo desde el minuto cero. Cuando actives el
      # Dependency graph, quita el continue-on-error para que sí bloquee.
      - name: Revisión de dependencias en el PR
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        continue-on-error: true
        with:
          fail-on-severity: high

      # ── Node ──
      # - uses: actions/setup-node@v4
      #   with:
      #     node-version: '22'
      # - run: npm audit --audit-level=high

      # ── Python ──
      # - uses: actions/setup-python@v5
      #   with:
      #     python-version: '3.12'
      # - run: |
      #     pip install pip-audit
      #     pip-audit

      # ── .NET ──
      # - uses: actions/setup-dotnet@v4
      #   with:
      #     dotnet-version: '8.0.x'
      # - run: dotnet list package --vulnerable --include-transitive

      - name: Recordatorio
        run: echo "::notice::Descomenta el auditor de dependencias de tu stack en .github/workflows/security.yml"
