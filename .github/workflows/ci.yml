name: CI

# ─────────────────────────────────────────────────────────────────────────────
# PLANTILLA. Descomenta el bloque de tu stack y borra el resto.
# Objetivo: que el pipeline completo tarde menos de 10 minutos. Si tarda más,
# la gente deja de esperarlo y empieza a mergear sin mirar.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  placeholder:
    name: Configurar CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Recordatorio
        run: |
          echo "::warning::El CI no está configurado. Descomenta el bloque de tu stack en .github/workflows/ci.yml (TASK-004)."

