name: CI

# Objetivo: que el pipeline completo tarde menos de 10 minutos. Si tarda más,
# la gente deja de esperarlo y empieza a mergear sin mirar.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node.js
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Instalar
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tipos
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      # El icono se genera por script. Si alguien lo edita a mano, el build de
      # Vercel serviría algo que este repositorio no sabe reproducir.
      - name: Los iconos coinciden con el script que los genera
        run: |
          npm run icons
          git diff --exit-code -- app/icon.png app/apple-icon.png public/ extension/icon-128.png
